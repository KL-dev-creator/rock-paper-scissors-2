<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors Project</title>
</head>
<body>
    <div class = 'container'>
        <button id = "rock">Rock</button>
        <button id = "paper">Paper</button>
        <button id = "scissors">Scissors</button>
    </div>
    <div class = 'outcome'>

    </div>

    <script>

        const rockButton = document.querySelector('.rock')
        const paperButton = document.querySelector('.paper')
        const scissorsButton = document.querySelector('.scissors')
        const outcomeDiv = document.querySelector('.outcome')


        let humanScore = 0;
        let computerScore = 0;
        let roundCounter = 1;

        function deleteButtons () {
            // var element = document.getElementById("parent");
            // element.
            //SEE THE SHOPPING LIST EXAMPLE LATER
        }
       
        // writing logic to get the computer choice

        function getComputerChoice () {
            const minCeiled = Math.ceil(1);
            const maxFloored = Math.floor(4);
            let computerNumber = Math.floor(Math.random() * (4-1) + 1);

            let computerChoice = "";

            if (computerNumber == 1) {
                computerChoice = "rock";
            } else if (computerNumber == 2) {
                computerChoice = "paper";   
            } else {
                computerChoice = "scissors";
            }

            return computerChoice;
        }

        function checkForWinner (humanScore, computerScore) {
            const p3 = document.createElement('p3')
            const lineBreak = document.createElement("br");
            if (humanScore == 5) {
                roundCounter += 0;
                outcomeDiv.appendChild(lineBreak)
                p3.innerText = "\n The Human has " + humanScore + " points while the Computer has " +computerScore + " points. The Human is the winner!"
                outcomeDiv.appendChild(p3)
                deleteButtons()
                
            } else if (computerScore == 5) {
                roundCounter += 0;
                outcomeDiv.appendChild(lineBreak)
                p3.innerText = "\n The Computer has " + computerScore + " points while the Human has " + humanScore + " points. The Computer is the winner!"
                outcomeDiv.appendChild(p3)
                deleteButtons()
            } else {

            }
        }

        function playGame() {
                const computerSelection = getComputerChoice();

                rock.addEventListener('click', () => {
                        const computerChoice = getComputerChoice()
                        const humanChoice = 'rock'
                        playRound(humanChoice, computerChoice)
                        checkForWinner(humanScore, computerScore)
                })

                paper.addEventListener('click', () => {
                        const computerChoice = getComputerChoice()
                        const humanChoice = 'paper'
                        playRound(humanChoice, computerChoice)
                        checkForWinner(humanScore, computerScore)
                })

                scissors.addEventListener('click', () => {
                        const computerChoice = getComputerChoice()
                        const humanChoice = 'scissors'
                        playRound(humanChoice, computerChoice)
                        checkForWinner(humanScore, computerScore)
                })

                function playRound(humanChoice, computerChoice) {

                    const p = document.createElement('p')
                    const p2 = document.createElement('p2')
                    roundCounter += 1;

                    if (humanChoice == computerChoice) {
                        p.innerText = "Both the Human and the Computer chose the same option it is a Tie! Nobody gets a point"
                        p2.innerText = "The current score is Human: " + humanScore + " Computer: " + computerScore
                        outcomeDiv.appendChild(p)
                        outcomeDiv.appendChild(p2)
                    } else if (humanChoice == "rock") {
                        if (computerChoice == "paper") {
                            computerScore += 1;
                            p.innerText = "Rock loses to paper, the Computer gets a point."
                            p2.innerText = "The current score is Human: " + humanScore + " Computer: " + computerScore
                            outcomeDiv.appendChild(p)
                            outcomeDiv.appendChild(p2)
                        } else if (computerChoice == "scissors") {
                            humanScore += 1;
                            p.innerText = "Rock wins againsts scissors, you get a point."
                            p2.innerText = "The current score is Human: " + humanScore + " Computer: " + computerScore
                            outcomeDiv.appendChild(p)
                            outcomeDiv.appendChild(p2)
                        }
                    } else if (humanChoice == "paper") {
                        if (computerChoice == "rock") {
                            humanScore += 1;
                            p.innerText = "Paper wins againsts rock, you get a point."
                            p2.innerText = "The current score is Human: " + humanScore + " Computer: " + computerScore
                            outcomeDiv.appendChild(p)
                            outcomeDiv.appendChild(p2)
                        } else if (computerChoice = "scissors") {
                            computerScore += 1;
                            p.innerText = "Paper loses to scissors, the Computer gets a point."
                            p2.innerText = "The current score is Human: " + humanScore + " Computer: " + computerScore
                            outcomeDiv.appendChild(p)
                            outcomeDiv.appendChild(p2)
                        } 
                    } else if (humanChoice == "scissors") {
                        if (computerChoice == "rock") {
                            computerScore += 1;
                            p.innerText = "Scissors loses against rock, the Computer gets a point"
                            p2.innerText = "The current score is Human: " + humanScore + " Computer: " + computerScore
                            outcomeDiv.appendChild(p)
                            outcomeDiv.appendChild(p2)
                        } else if (computerChoice = "paper") {
                            humanScore += 1;
                            p.innerText = "Scissors wins against paper, you get a point."
                            p2.innerText = "The current score is Human: " + humanScore + " Computer: " + computerScore
                            outcomeDiv.appendChild(p)
                            outcomeDiv.appendChild(p2)
                        } 
                    }

                }

            }            
        
    
    // Function to start playing the game
    playGame()

    const button = document.querySelector('button');

    </script>

</body>
